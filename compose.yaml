# Local development only: credentials are not secrets, port bound to loopback.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow_local_only
      POSTGRES_DB: docflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
